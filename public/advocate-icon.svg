<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background with subtle premium warm gold gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg-grad)" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Advocate Collar / Scales of Justice combined silhouette -->
  <g transform="translate(10, 10)">
    <!-- Head of the Advocate -->
    <circle cx="40" cy="28" r="14" fill="#2D2219" />
    
    <!-- Advocate Robe / Suit -->
    <path d="M12 75 C12 55, 20 48, 40 48 C60 48, 68 55, 68 75 Z" fill="#2D2219" />
    
    <!-- Advocate Bands (The White legal collar neckbands) -->
    <!-- Base white shirt collar -->
    <path d="M32 48 L48 48 L45 52 L35 52 Z" fill="#FFFFFF" />
    <!-- Left Band -->
    <path d="M34 52 L39 52 L37 72 L31 71 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5" />
    <!-- Right Band -->
    <path d="M41 52 L46 52 L49 71 L43 72 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.5" />
  </g>
</svg>
